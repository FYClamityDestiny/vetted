# Run any npm or PyPI package in the no-network sandbox on GitHub's machines (they have Docker).
# Actions tab -> sandbox -> Run workflow, or: gh workflow run sandbox -f ecosystem=npm -f package=left-pad@1.3.0
name: sandbox
on:
  workflow_dispatch:
    inputs:
      ecosystem: { description: 'npm or pypi', required: true, type: choice, options: [npm, pypi] }
      package: { description: 'exact version: name@1.2.3 (npm) or name==1.2.3 (pypi)', required: true }
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate input
        env: { PKG: '${{ inputs.package }}' }
        run: '[[ "$PKG" =~ ^(@[a-z0-9._-]+/)?[A-Za-z0-9._-]+(@|==)[A-Za-z0-9._+-]+$ ]] || { echo "Use an exact version, like left-pad@1.3.0 or six==1.16.0"; exit 1; }'
      - name: Sandbox install
        env: { PKG: '${{ inputs.package }}', ECO: '${{ inputs.ecosystem }}' }
        run: |
          set +e; out=$(bash scripts/sandbox.sh "$ECO" "$PKG" 2>&1); rc=$?
          echo "$out"
          { echo "### Sandbox: \`$PKG\` ($ECO)"; echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ $rc -le 1 ] || exit $rc
