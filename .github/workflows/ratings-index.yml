# After ratings are merged, rebuild docs/ratings.json (what the site and the plugin read).
name: ratings index
on:
  push:
    branches: [main]
    paths: ['ratings/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/ci/build-index.mjs ratings docs/ratings.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ratings.json
          git diff --cached --quiet || (git commit -m "Rebuild ratings index" && git push)
